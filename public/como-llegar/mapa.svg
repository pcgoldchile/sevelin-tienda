<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-labelledby="t d">
  <title id="t">Cómo llegar a Sevelin</title>
  <desc id="d">Mapa: Sevelin está en la esquina del Pasaje San Rafael con la Avenida Robinson Rojas, frente a la línea del tren. La puerta mira a Robinson Rojas, no al pasaje. Calles de referencia: Buena Esperanza, La Ligua, Pasaje La Serena, Cancha Rayada y Comandante Riveros.</desc>
  <defs>
    <linearGradient id="sAzul" gradientUnits="userSpaceOnUse" x1="32" y1="233.8" x2="707.6" y2="684.4">
      <stop offset="0" stop-color="#73FCFD"/><stop offset="0.27" stop-color="#01B7FD"/><stop offset="0.55" stop-color="#007DFD"/><stop offset="1" stop-color="#0058FD"/>
    </linearGradient>
    <filter id="brillo" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- Manzanas -->
  <rect width="1200" height="1000" fill="#0e1729"/>
  <g fill="#132038" stroke="#1a2a47" stroke-width="2">
    <rect x="232" y="215" width="276" height="130" rx="10" transform="rotate(-10 370 280)"/>
    <rect x="560" y="130" width="220" height="150" rx="10" transform="rotate(-10 670 205)"/>
    <rect x="232" y="478" width="270" height="335" rx="10" transform="rotate(-2 367 645)"/>
    <rect x="565" y="365" width="222" height="218" rx="10" transform="rotate(-3 676 474)"/>
    <rect x="565" y="640" width="236" height="250" rx="10" transform="rotate(-2 683 765)"/>
    <rect x="1132" y="40" width="80" height="160" rx="10"/>
    <rect x="1140" y="275" width="70" height="440" rx="10"/>
    <rect x="-10" y="-10" width="118" height="398" rx="10"/>
    <rect x="-10" y="500" width="100" height="520" rx="10"/>
  </g>

  <!-- Bandejón con la línea del tren -->
  <polygon points="822,0 1030,0 1078,1000 918,1000" fill="#0f3a2a"/>
  <g stroke="#7c5a3a" stroke-width="5">
    <line x1="908" y1="40" x2="946" y2="38"/><line x1="912" y1="120" x2="950" y2="118"/><line x1="916" y1="200" x2="954" y2="198"/>
    <line x1="919" y1="280" x2="957" y2="278"/><line x1="923" y1="360" x2="961" y2="358"/><line x1="927" y1="440" x2="965" y2="438"/>
    <line x1="930" y1="520" x2="968" y2="518"/><line x1="934" y1="600" x2="972" y2="598"/><line x1="937" y1="680" x2="975" y2="678"/>
    <line x1="941" y1="760" x2="979" y2="758"/><line x1="945" y1="840" x2="983" y2="838"/><line x1="948" y1="920" x2="986" y2="918"/>
  </g>
  <line x1="912" y1="0" x2="958" y2="1000" stroke="#9aa4b2" stroke-width="4"/>
  <line x1="936" y1="0" x2="982" y2="1000" stroke="#9aa4b2" stroke-width="4"/>

  <!-- Calles -->
  <g fill="none" stroke="#2b3b5c" stroke-linecap="round">
    <path d="M150,-20 C178,300 200,700 140,1020" stroke-width="52"/>
    <path d="M225,185 L815,62" stroke-width="38"/>
    <path d="M-20,443 L850,318" stroke-width="48"/>
    <path d="M1060,236 L1220,222" stroke-width="40"/>
    <path d="M528,360 L536,890" stroke-width="32"/>
    <path d="M280,838 L860,918" stroke-width="40"/>
    <path d="M1055,-20 L1102,1020" stroke-width="54"/>
    <path d="M1100,748 L1220,744" stroke-width="34"/>
  </g>

  <!-- Pasaje San Rafael: angosto, con borde de advertencia -->
  <path d="M545,618 L812,608" fill="none" stroke="#3a2a33" stroke-width="30" stroke-linecap="round"/>
  <path d="M545,618 L812,608" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="10 9" stroke-linecap="round" opacity="0.85"/>

  <!-- Av. Robinson Rojas (la de la entrada), destacada -->
  <path d="M790,-20 C805,350 840,700 888,1020" fill="none" stroke="#1d4ed8" stroke-width="84" opacity="0.4" filter="url(#brillo)"/>
  <path d="M790,-20 C805,350 840,700 888,1020" fill="none" stroke="#2563eb" stroke-width="58" stroke-linecap="round"/>
  <path d="M790,-20 C805,350 840,700 888,1020" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="22 18" opacity="0.7"/>

  <!-- Nombres de calles -->
  <g font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-weight="600" fill="#cbd5e1" font-size="24">
    <text transform="translate(196 640) rotate(-88)" text-anchor="middle">Cancha Rayada</text>
    <text transform="translate(520 112) rotate(-11.7)" text-anchor="middle">Comandante Riveros</text>
    <text transform="translate(330 391) rotate(-8.2)" text-anchor="middle" font-size="26">Buena Esperanza</text>
    <text transform="translate(1192 224) rotate(-5)" text-anchor="end" font-size="19">Buena Esperanza</text>
    <text transform="translate(540 760) rotate(-89)" text-anchor="middle" font-size="21">Pje. La Serena</text>
    <text transform="translate(470 872) rotate(7.9)" text-anchor="middle">La Ligua</text>
    <text transform="translate(1088 500) rotate(87.3)" text-anchor="middle" font-size="21">Av. Robinson Rojas Ote.</text>
    <text transform="translate(640 622) rotate(-2.2)" text-anchor="middle" font-size="18" fill="#fdba74">Pje. San Rafael</text>
  </g>
  <text transform="translate(816 300) rotate(85.5)" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-weight="700" font-size="30" fill="#ffffff" letter-spacing="1">AV. ROBINSON ROJAS</text>
  <text transform="translate(985 250) rotate(87.4)" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-weight="700" font-size="22" fill="#86efac">LÍNEA DEL TREN</text>

  <!-- Paraderos de Buena Esperanza -->
  <g>
    <g transform="translate(188 356)"><circle r="18" fill="#334155" stroke="#e2e8f0" stroke-width="2"/><rect x="-9" y="-10" width="18" height="16" rx="3" fill="#e2e8f0"/><rect x="-6" y="-7" width="12" height="5" fill="#334155"/><circle cx="-5" cy="9" r="2.5" fill="#e2e8f0"/><circle cx="5" cy="9" r="2.5" fill="#e2e8f0"/></g>
    <g transform="translate(300 520)"><circle r="18" fill="#334155" stroke="#e2e8f0" stroke-width="2"/><rect x="-9" y="-10" width="18" height="16" rx="3" fill="#e2e8f0"/><rect x="-6" y="-7" width="12" height="5" fill="#334155"/><circle cx="-5" cy="9" r="2.5" fill="#e2e8f0"/><circle cx="5" cy="9" r="2.5" fill="#e2e8f0"/></g>
  </g>

  <!-- Aviso del pasaje -->
  <g transform="translate(565 516)" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="226" height="60" rx="14" fill="#1f1115" stroke="#f97316" stroke-width="2"/>
    <text x="16" y="26" font-size="18" font-weight="700" fill="#fdba74">✕ No es por el pasaje</text>
    <text x="16" y="47" font-size="15" fill="#fed7aa">Google te deja aquí</text>
  </g>

  <!-- Sevelin, donde está el pin de Google -->
  <circle cx="762" cy="690" r="80" fill="#0ea5e9" opacity="0.5" filter="url(#brillo)"/>
  <circle cx="762" cy="690" r="54" fill="#050b1a" stroke="#3ff3ff" stroke-width="5"/>
  <path transform="translate(735 659) scale(0.071)" d="M381.5 32.0 L731.0 233.8 L731.0 420.3 L376.2 215.4 L260.1 282.5 L731.0 554.3 L731.0 648.6 L393.6 843.4 L32.0 634.6 L32.0 440.5 L420.0 664.5 L500.3 618.1 L32.0 347.7 L32.0 233.8 Z" fill="url(#sAzul)"/>
  <g font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="690" y="752" width="144" height="38" rx="10" fill="#050b1a" opacity="0.85"/>
    <text x="762" y="779" font-weight="700" font-size="26" fill="#ffffff">SEVELIN</text>
  </g>

  <!-- Entrada: flecha hacia la avenida -->
  <path d="M820,690 L866,690" stroke="#facc15" stroke-width="10" stroke-linecap="round"/>
  <path d="M864,672 L894,690 L864,708 Z" fill="#facc15"/>
  <g transform="translate(904 664)" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="214" height="54" rx="27" fill="#facc15"/>
    <text x="107" y="35" text-anchor="middle" font-size="23" font-weight="700" fill="#111827">◀ ENTRADA AQUÍ</text>
  </g>

  <!-- Norte -->
  <g transform="translate(60 930)" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
    <circle r="28" fill="#0b1220" stroke="#475569" stroke-width="2"/>
    <path d="M0,-18 L8,6 L0,1 L-8,6 Z" fill="#e2e8f0"/>
    <text y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">N</text>
  </g>
</svg>
